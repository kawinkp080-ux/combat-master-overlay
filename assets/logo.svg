    <path d="M24 24 L40 24 M24 24 L24 40" stroke="#e8f1f2" stroke-width="2"/>
    <path d="M232 24 L216 24 M232 24 L232 40" stroke="#e8f1f2" stroke-width="2"/>
    <path d="M24 232 L40 232 M24 232 L24 216" stroke="#e8f1f2" stroke-width="2"/>
    <path d="M232 232 L216 232 M232 232 L232 216" stroke="#e8f1f2" stroke-width="2"/>
    <!-- Tiny wordmark stencil -->
    <text x="128" y="244" font-family="monospace" font-size="7" font-weight="bold" fill="#e8f1f2" text-anchor="middle" letter-spacing="3">COMBAT MASTER</text>
  </g>
</svg>
